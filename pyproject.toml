[project]
name = "lock-out"
version = "0.1.0"
description = "Street-parking bicycle theft risk for Berlin planning areas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "geopandas>=0.14.0",
    "osmnx>=1.9.0",
    "scikit-learn>=1.4.0",
    "statsmodels>=0.14.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
