            }

            // ---------- App ----------
            const SIM = {
                real: "Real GPS",
                inside: "Inside Berlin",
                outside: "Outside Berlin (Hamburg)",
                denied: "Permission denied",
                timeout: "Timeout"
            };

            function App() {
                const [loaded, setLoaded] = useState(false);
                const [filters, setFilters] = useState({
                    day: "weekday",
                    part: "evening",
                    bike: "standard"
                });
                const [selected, setSelected] = useState(null),
                    [via, setVia] = useState(null);
                const [hint, setHint] = useState(true);
                const [loc, setLoc] = useState("idle");
                const [locErr, setLocErr] = useState(null);
                const [banner, setBanner] = useState(null);
                const [myPos, setMyPos] = useState(null),
                    [locArea, setLocArea] = useState(null);
                const [sim, setSim] = useState("real");
                const [info, setInfo] = useState(false),
                    [fopen, setFopen] = useState(false),
                    [drag, setDrag] = useState(0),
                    [snap, setSnap] = useState("peek"),
                    [desk, setDesk] = useState(
                        () => mq("(min-width:768px)").matches
                    );
                const [mode, setMode] = useState("auto"),
                    [cb, setCb] = useState(false),
                    [theme, setTheme] = useState(() =>
                        applyTheme("auto", false)
                    );
                const mapRef = useRef(null),
                    hideT = useRef(null);
                const toggleDark = () =>
                    setMode(theme.startsWith("dark") ? "light" : "dark");
                const setFilter = k => v => setFilters(f => ({ ...f, [k]: v }));

                useEffect(() => {
                    // re-resolve tokens on mode or OS preference change
                    const run = () => setTheme(applyTheme(mode, cb));
                    run();
                    const qs = [
                        mq("(prefers-color-scheme: dark)"),
                        mq("(prefers-contrast: more)")
                    ];
                    qs.forEach(q => q.addEventListener("change", run));
                    return () =>
                        qs.forEach(q => q.removeEventListener("change", run));
                }, [mode, cb]);
                useEffect(() => {
                    const q = mq("(min-width:768px)"),
                        run = () => setDesk(q.matches);
                    q.addEventListener("change", run);
                    return () => q.removeEventListener("change", run);
                }, []);
                useEffect(() => {
                    const t = setTimeout(() => setLoaded(true), 700);
                    return () => clearTimeout(t);
                }, []);

                const dismissHint = () => setHint(false);
                const asideRef = useRef(null);
                const onSelect = id => {
                    if (!selected) setSnap("peek");
                    setSelected(id);
                    setHint(false);
                };
                const onPick = (id, v) => {
                    onSelect(id);
                    setVia(v ? { ...v, id } : null);
                    // show the whole area, not a street-level zoom on the place
                    mapRef.current?.fitBounds(AREAS[id].bbox, {
                        padding: [60, 60],
                        maxZoom: 15
                    });
                };
                useEffect(() => {
                    // pin = "you searched here"; only while its area is still the selection
                    const m = mapRef.current;
                    if (!m || !via || !via.ll || via.id !== selected) return;
                    const pin = L.circleMarker(via.ll, {
                        radius: 7,
                        color: CUR.card,
                        weight: 3,
                        fillColor: CUR.located,
                        fillOpacity: 1,
                        interactive: false
                    })
                        .bindTooltip(via.label, {
                            permanent: true,
                            direction: "top"
                        })
                        .addTo(m);
                    return () => pin.remove();
                }, [via, selected]);
                const onOutside = (c, ev) => {
                    const out = !areaAt([c.lat, c.lng]);
                    clearTimeout(hideT.current);
                    if (out) setBanner(b => b || "drag");
                    else if (ev === "end")
                        hideT.current = setTimeout(
                            () => setBanner(b => (b === "drag" ? null : b)),
                            1500
                        );
                };
                const backToBerlin = () => {
                    setBanner(null);
                    mapRef.current.fitBounds(BERLIN_BOUNDS, { animate: false });
                };
                const gotFix = (lat, lng) => {
                    setLoc("idle");
                    setLocErr(null);
                    const a = areaAt([lat, lng]);
                    setMyPos([lat, lng]);
                    if (a) {
                        setBanner(null);
                        setLocArea(a.id);
                        mapRef.current.setView([lat, lng], 13, {
                            animate: false
                        });
                    } else {
                        setLocArea(null);
                        mapRef.current.fitBounds(BERLIN_BOUNDS, {
                            animate: false
                        });
                        setBanner("gps");
                    }
                };
                const locate = () => {
                    setHint(false);
                    setLocErr(null);
                    setLoc("loading");
                    if (sim === "inside")
                        return setTimeout(() => gotFix(52.51, 13.4), 1200);
                    if (sim === "outside")
                        return setTimeout(() => gotFix(53.55, 9.99), 1200);
                    if (sim === "denied")
                        return setTimeout(() => {
                            setLoc("idle");
                            setLocErr("denied");
                        }, 1200);
                    if (sim === "timeout")
                        return setTimeout(() => {
                            setLoc("idle");
                            setLocErr("unavailable");
                        }, 3500);
                    if (!navigator.geolocation) {
                        setLoc("idle");
                        return setLocErr("unavailable");
                    }
                    navigator.geolocation.getCurrentPosition(
                        p => gotFix(p.coords.latitude, p.coords.longitude),
                        e => {
                            setLoc("idle");
                            setLocErr(e.code === 1 ? "denied" : "unavailable");
                        },
                        { timeout: 10000 }
                    );
                };

                const r =
                    selected &&
                    getAnswer(
                        selected,
                        filters.day,
                        filters.part,
                        filters.bike
                    );

                const sheetBottom = desk
                    ? "1.5rem"
                    : r
                      ? `calc(${sheetH(snap, r)} + ${drag}px + 12px)`
                      : "2.5rem";
                if (!loaded)
                    return (
                        <div className="h-full flex items-center justify-center muted display text-xl">
                            Loading Berlin data…
                        </div>
                    );
                return (
                    <div className="relative h-full overflow-hidden md:flex">
                        {(desk || r) && (
                            <aside
                                ref={asideRef}
                                className="absolute z-[1000] bottom-0 left-0 right-0 flex flex-col panel rounded-b-none md:static md:w-[400px] md:shrink-0 md:h-full md:rounded-none"
                                style={{
                                    height: desk
                                        ? undefined
                                        : `calc(${sheetH(snap, r)} + ${drag}px)`,
                                    minHeight: desk ? undefined : 120,
                                    maxHeight: desk ? undefined : "95%",
                                    borderTop: "4px solid var(--rule)"
                                }}
                                aria-label="Risk details"
                            >
                                <Handle
                                    snap={snap}
                                    setSnap={setSnap}
                                    onClose={() => setSelected(null)}
                                    onDrag={setDrag}
                                    asideRef={asideRef}
                                />
                                <div className="px-4 pb-4 pt-1 md:pt-4 flex flex-col gap-3 safe-x safe-b overflow-y-auto flex-1 min-h-0">
                                    {desk && (
                                        <>
                                            <div className="flex items-center gap-2">
                                                <h1
                                                    className="text-2xl flex-1"
                                                    style={{
                                                        lineHeight: "2rem"
                                                    }}
                                                >
                                                    LockOut
                                                </h1>
                                                <button
                                                    className="iconbtn"
                                                    onClick={toggleDark}
                                                    aria-pressed={theme.startsWith(
                                                        "dark"
                                                    )}
                                                    aria-label="Dark mode"
                                                >
                                                    {theme.startsWith("dark")
                                                        ? "☾"
                                                        : "☀"}
                                                </button>
                                                <button
                                                    className="iconbtn font-serif italic"
                                                    onClick={() =>
                                                        setInfo(true)
                                                    }
                                                    aria-label="About this prototype"
                                                >
                                                    i
                                                </button>
                                            </div>
                                            <div>
                                                <AreaPicker
                                                    selected={selected}
                                                    onSelect={onPick}
 via={via}
                                                />
                                            </div>
                                            <Chips
                                                filters={filters}
                                                setFilter={setFilter}
                                            />
                                        </>
                                    )}
                                    {r ? (
                                        <Card
                                            r={r}
                                            eff={desk ? "full" : snap}
                                            cb={cb}
                                            setCb={setCb}
                                            onClose={() => setSelected(null)}
                                        />
                                    ) : null}
                                </div>
                            </aside>
                        )}

                        <div className="absolute inset-0 isolate md:relative md:flex-1 md:min-w-0">
                            <RiskMap
                                filters={filters}
                                selected={selected}
                                locArea={locArea}
                                myPos={myPos}
                                theme={theme}
                                onSelect={onSelect}
                                onInteract={dismissHint}
                                onOutside={onOutside}
                                mapRef={mapRef}
                            />

                            <div
                                className="absolute z-[1050] left-0 right-0 flex flex-col gap-2 pointer-events-none [&>*]:pointer-events-auto safe-x"
                                style={{
                                    top: "max(.5rem,env(safe-area-inset-top))"
                                }}
                            >
                                {!desk && (
                                    <>
                                        <div className="flex items-center gap-2">
                                            <AreaPicker
                                                selected={selected}
                                                onSelect={onPick}
 via={via}
                                            />
                                            <button
                                                className="fab"
                                                style={{
                                                    width: 44,
                                                    height: 44
                                                }}
                                                onClick={toggleDark}
                                                aria-pressed={theme.startsWith(
                                                    "dark"
                                                )}
                                                aria-label="Dark mode"
                                            >
                                                {theme.startsWith("dark")
                                                    ? "☾"
                                                    : "☀"}
                                            </button>
                                            <button
                                                className="iconbtn font-serif italic fab"
                                                style={{
                                                    width: 44,
                                                    height: 44
                                                }}
                                                onClick={() => setInfo(true)}
                                                aria-label="About this prototype"
                                            >
                                                i
                                            </button>
                                        </div>
                                        <div className="relative">
                                            <button
                                                className="chip small w-full text-left"
                                                style={{ minHeight: 44 }}
                                                aria-expanded={fopen}
                                                onClick={() =>
                                                    setFopen(o => !o)
                                                }
                                            >
                                                {DAYPARTS[filters.part].label} ·{" "}
                                                {DAYTYPES[filters.day].label} ·{" "}
                                                {BIKES[filters.bike].label}{" "}
                                                <span aria-hidden="true">
                                                    {fopen ? "▴" : "▾"}
                                                </span>
                                            </button>
                                            {fopen && (
                                                <div className="panel p-3 mt-1">
                                                    <Chips
                                                        filters={filters}
                                                        setFilter={setFilter}
                                                    />
                                                </div>
                                            )}
                                        </div>
                                    </>
                                )}
                                {hint && (
                                    <div
                                        role="status"
                                        className="notice flex items-center gap-3 px-3 py-2"
                                    >
                                        <span className="flex-1 small">
                                            Tap an area on the map, or search
                                            for one, to see its bike-theft risk
                                            and lock advice.
                                        </span>
                                        <button
                                            className="iconbtn text-xl"
                                            onClick={dismissHint}
                                            aria-label="Dismiss"
                                        >
                                            ×
                                        </button>
                                    </div>
                                )}
                                {banner && (
                                    <div
                                        role="status"
                                        className="notice flex items-center gap-3 px-3 py-2"
                                    >
                                        <span className="flex-1 small">
                                            LockOut only covers Berlin. You're
                                            outside the area, so there's no risk
                                            data here.
                                        </span>
                                        <button
                                            className="btn"
                                            onClick={backToBerlin}
                                        >
                                            Back to Berlin
                                        </button>
                                    </div>
                                )}
                                {locErr && (
                                    <div
                                        role="alert"
                                        className="notice flex items-center gap-3 px-3 py-2"
                                    >
                                        <span className="flex-1 small">
                                            {locErr === "denied"
                                                ? "Location is blocked. Enable it in browser settings, or just tap an area on the map."
                                                : "Couldn't get your location."}
                                        </span>
                                        {locErr === "unavailable" && (
                                            <button
                                                className="btn"
                                                onClick={locate}
                                            >
                                                Retry
                                            </button>
                                        )}
                                        <button
                                            className="iconbtn text-xl"
                                            onClick={() => setLocErr(null)}
                                            aria-label="Dismiss"
                                        >
                                            ×
                                        </button>
                                    </div>
                                )}
                            </div>

                            {(desk || !r || snap !== "full") && (
                                <>
                                    <div
                                        className="absolute z-[1000] left-3"
                                        style={{ bottom: sheetBottom }}
                                    >
                                        <Legend
                                            cb={cb}
                                            setCb={setCb}
                                            sim={sim}
                                            setSim={setSim}
                                        />
                                    </div>
                                    <div
                                        className="absolute z-[1000] right-3 flex flex-col items-end gap-3"
                                        style={{ bottom: sheetBottom }}
                                    >
                                        <button
                                            className="fab"
                                            aria-label="Zoom in"
                                            onClick={() =>
                                                mapRef.current.zoomIn()
                                            }
                                        >
                                            +
                                        </button>
                                        <button
                                            className="fab"
                                            aria-label="Zoom out"
                                            onClick={() =>
                                                mapRef.current.zoomOut()
                                            }
                                        >
                                            −
                                        </button>
                                        <button
                                            className="fab"
                                            aria-label="Locate me"
                                            onClick={locate}
                                            disabled={loc === "loading"}
                                        >
                                            {loc === "loading" ? "…" : "📍"}
                                        </button>
                                    </div>
                                </>
                            )}
                        </div>

                        {location.protocol === "file:" && (
                            <div className="absolute z-[3000] bottom-10 left-3 right-3 notice p-3 small">
                                OSM blocks tiles for pages opened from disk (no
                                Referer). Run{" "}
                                <code>python3 -m http.server 8000 -d demo</code>{" "}
                                and open http://localhost:8000
                            </div>
                        )}
                        {info && (
                            <div
                                className="absolute inset-0 z-[2000] flex items-center justify-center p-4"
                                style={{ background: "rgba(0,0,0,.6)" }}
                                onClick={() => setInfo(false)}
                            >
                                <div
                                    role="dialog"
                                    aria-modal="true"
                                    className="panel p-5 max-w-md space-y-2"
                                    onClick={e => e.stopPropagation()}
                                >
                                    <h2 className="text-2xl">
                                        Prototype for user testing
                                    </h2>
                                    <p>
                                        Areas, ratings and numbers are random
                                        mock data. No account, no tracking,
                                        nothing is saved between visits.
                                    </p>
                                    <p>
                                        The "Test control" in the details panel
                                        lets a moderator force each location
                                        outcome (inside Berlin, outside, denied,
                                        timeout). The ☀/☾ button at the top
                                        toggles dark mode. Drag the details
                                        panel up or down to see more or less.
                                    </p>
                                    <p className="small muted">
                                        Map © OpenStreetMap contributors (ODbL).
                                        Data source: Polizei Berlin (CC-BY 4.0). Search: Amt für Statistik Berlin-Brandenburg (postcodes, street sections, CC-BY 3.0), VBB (stations).
                                    </p>
                                    <button
                                        className="btn"
                                        onClick={() => setInfo(false)}
                                    >
                                        Close
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            Promise.all([
                fetch("lor.json").then(r => r.json()),
                // search is optional: without the lookup the picker still finds areas by name
                fetch("gazetteer.json")
                    .then(r => r.json())
                    .catch(() => null)
            ])
                .then(([rows, gaz]) => {
                    loadAreas(rows);
                    if (gaz) loadGaz(gaz);
                    // Self-check: every combination (incl. bogus keys) yields a complete answer; location mocks resolve as expected.
                    for (const a of [
                        ...Object.keys(AREAS).slice(0, 20),
                        "bogus"
                    ])
                        for (const d of [...Object.keys(DAYTYPES), "x"])
                            for (const p of [...Object.keys(DAYPARTS), "x"])
                                for (const b of [...Object.keys(BIKES), "x"]) {
                                    const r = getAnswer(a, d, p, b);
                                    console.assert(
                                        TIERS[r.tier] &&
                                            r.lock.main &&
                                            r.reasons.length &&
                                            CONF_WHY[r.conf],
                                        "bad answer",
                                        a,
                                        d,
                                        p,
                                        b
                                    );
                                }
                    console.assert(
                        areaAt([52.51, 13.4]) && !areaAt([53.55, 9.99]),
                        "location mock test failed"
                    );
                    ReactDOM.createRoot(document.getElementById("root")).render(
                        <App />
                    );
                })
                .catch(() => {
                    document.getElementById("root").textContent =
                        "Could not load lor.json. Serve the demo folder over HTTP.";
                });
        </script>
    </body>
</html>
