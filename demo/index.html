<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LockOut – Berlin Theft Intel (Prototype)</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
  @keyframes pulseRing { 0%{transform:scale(.6);opacity:.8} 100%{transform:scale(2.4);opacity:0} }
  .pulse-ring { transform-origin:center; transform-box:fill-box; animation:pulseRing 1.8s ease-out infinite; }
  @keyframes glow { 0%,100%{box-shadow:0 0 6px #f59e0b} 50%{box-shadow:0 0 18px #f59e0b} }
  .glow { animation:glow 1.6s ease-in-out infinite; }
</style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

// ---------- MOCK FIXTURE (all numbers invented for the prototype) ----------
const AREAS = {
  "01100101": { name: "Stralauer Kiez (Friedrichshain)", pos: [62, 52], base: 62, rank: 14, ctx: 18, lockDefeat: 79, value: 780, spike: false,
    factors: ["Dense residential blocks with many unattended street-parked bikes", "Low rack density near the Spree-side corridor", "Moderate tram/S-Bahn foot traffic"] },
  "01100202": { name: "Boxhagener Platz (Friedrichshain)", pos: [68, 48], base: 78, rank: 8, ctx: 35, lockDefeat: 84, value: 1150, spike: true,
    factors: ["Peak evening entertainment corridor (bars, Sunday market)", "Low street rack density relative to visitor volume", "High transit foot traffic at Warschauer Str."] },
  "01200101": { name: "Alexanderplatz (Mitte)", pos: [50, 44], base: 90, rank: 3, ctx: 48, lockDefeat: 88, value: 1320, spike: true,
    factors: ["Major transit hub: S/U/Tram/Regional rail interchange", "Long dwell-time parking by commuters", "Dense crowds make theft tools less conspicuous"] },
  "02100101": { name: "Torstraße (Mitte)", pos: [44, 36], base: 52, rank: 22, ctx: -6, lockDefeat: 71, value: 960, spike: false,
    factors: ["Shop and café density provides natural surveillance", "Good rack supply along the main axis", "Moderate nightlife spillover"] },
};
// additive score modifiers; missing keys fall back to 0 via mod()
const DAYTYPES = { weekday: { label: "Mon–Thu", d: 0 }, friday: { label: "Friday", d: 6 }, weekend: { label: "Weekend", d: 4 } };
const DAYPARTS = { morning: { label: "Morning (06–11)", d: -8 }, afternoon: { label: "Afternoon (11–17)", d: 0 }, evening: { label: "Evening (17–22)", d: 9 }, night: { label: "Night (22–06)", d: 14 } };
const BIKES = { standard: { label: "Standard Bike", d: 0, valueX: 1 }, ebike: { label: "E-Bike / Cargo", d: 7, valueX: 2.6 } };
const FALLBACK_AREA = AREAS["01100202"];

const mod = (table, key) => (table[key] || { d: 0, valueX: 1 });

// Deterministic: same inputs -> same output; unknown keys never throw.
function getAnswer(areaId, dayType, daypart, bike) {
  const a = AREAS[areaId] || FALLBACK_AREA;
  const b = mod(BIKES, bike);
  const score = Math.max(0, Math.min(100, a.base + mod(DAYTYPES, dayType).d + mod(DAYPARTS, daypart).d + b.d));
  const tier = score >= 75 ? "HIGH" : score >= 55 ? "MEDIUM" : "LOW";
  const conf = a.rank <= 10 ? "HIGH" : a.rank <= 20 ? "MEDIUM" : "LOW";
  const night = daypart === "night" || daypart === "evening";
  return {
    score, tier, conf, area: a, bike,
    hotspot: `Top ${a.rank}% theft volume in Berlin`,
    context: a.ctx >= 0 ? `${a.ctx}% higher theft risk than typical for an area with this transit/shop density`
                        : `${-a.ctx}% lower theft risk than typical for an area with this transit/shop density`,
    lockDefeat: Math.min(98, a.lockDefeat + (b.valueX > 1 ? 3 : 0)),
    value: Math.round(a.value * b.valueX / 10) * 10,
    spike: a.spike && score >= 55,
    advice: adviceFor(tier, bike, night),
    factors: night ? [...a.factors.slice(0, 2), "Reduced natural surveillance after dark"] : a.factors,
  };
}
function adviceFor(tier, bike, night) {
  const out = [];
  if (tier === "HIGH") out.push("Dual-lock strategy: a VdS Klasse A+ / B+ rated hardened square-shackle U-lock plus a second lock of a different type (e.g. plate-chain), so no single tool defeats both.");
  else if (tier === "MEDIUM") out.push("Use one VdS Klasse B+ rated hardened square-shackle U-lock; add a second lock if parking longer than a few hours.");
  else out.push("A quality hardened U-lock (VdS-rated) is sufficient for short stops; avoid thin cable locks.");
  out.push("Lock frame and rear wheel to a fixed, immovable rack or post. Keep the shackle tight against the frame, leaving little room for leverage.");
  if (night) out.push("Prefer a well-lit, busy spot; avoid leaving the bike overnight on the street in this area.");
  if (bike === "ebike") out.push("E-Bike / Cargo: remove battery and display when parking, and register the frame number (Rahmennummer) with an anti-theft code.");
  return out;
}

// ---------- UI ----------
const TIER = {
  LOW:    { c: "emerald", hex: "#10b981", badge: "bg-emerald-500/15 text-emerald-300 border-emerald-500/50" },
  MEDIUM: { c: "amber",   hex: "#f59e0b", badge: "bg-amber-500/15 text-amber-300 border-amber-500/50" },
  HIGH:   { c: "rose",    hex: "#f43f5e", badge: "bg-rose-500/15 text-rose-300 border-rose-500/50" },
};

function Segmented({ label, options, value, onChange }) {
  return (
    <div>
      <div className="text-xs uppercase tracking-wider text-zinc-400 mb-1.5">{label}</div>
      <div role="group" aria-label={label} className="grid gap-1 p-1 bg-zinc-900 rounded-lg border border-zinc-800"
           style={{ gridTemplateColumns: `repeat(${Object.keys(options).length}, minmax(0,1fr))` }}>
        {Object.entries(options).map(([k, o]) => (
          <button key={k} aria-pressed={value === k} onClick={() => onChange(k)}
            className={"px-2 py-1.5 rounded-md text-xs sm:text-sm transition " + (value === k ? "bg-zinc-100 text-zinc-900 font-semibold" : "text-zinc-300 hover:bg-zinc-800")}>
            {o.label}
          </button>
        ))}
      </div>
    </div>
  );
}

function BerlinMap({ areaId, tier }) {
  const t = TIER[tier];
  return (
    <svg viewBox="0 0 100 80" className="w-full rounded-lg bg-zinc-900 border border-zinc-800" role="img" aria-label={`Map of Berlin, selected area risk ${tier}`}>
      <path d="M8 38 L22 16 L48 8 L74 14 L92 34 L86 60 L62 72 L30 70 L12 56 Z" fill="#18181b" stroke="#3f3f46" strokeWidth=".6" />
      <path d="M2 50 Q25 40 40 48 T70 40 T98 52" fill="none" stroke="#1e3a5f" strokeWidth="1.6" opacity=".8" />
      <path d="M20 30 H85 M35 14 V68 M55 10 V70 M12 48 H90" stroke="#27272a" strokeWidth=".5" />
      {Object.entries(AREAS).map(([id, a]) => {
        const sel = id === areaId;
        const [x, y] = a.pos;
        return (
          <g key={id}>
            {sel && <circle className="pulse-ring" cx={x} cy={y} r="4" fill={t.hex} />}
            {sel && <polygon points={`${x-6},${y+1} ${x-2},${y-5} ${x+5},${y-4} ${x+6},${y+3} ${x},${y+6}`} fill={t.hex} fillOpacity=".3" stroke={t.hex} strokeWidth=".8" />}
            <circle cx={x} cy={y} r={sel ? 2 : 1.3} fill={sel ? t.hex : "#71717a"} />
            <text x={x + 3} y={y - 3} fontSize="2.6" fill={sel ? "#fafafa" : "#71717a"}>{a.name.split(" (")[0]}</text>
          </g>
        );
      })}
      <text x="4" y="77" fontSize="2.4" fill="#52525b">Stylized map – not to scale</text>
    </svg>
  );
}

function Stat({ label, value, sub }) {
  return (
    <div className="rounded-lg bg-zinc-950/60 border border-zinc-800 p-3">
      <div className="text-xl font-bold">{value}</div>
      <div className="text-xs text-zinc-400">{label}</div>
      {sub && <div className="text-xs text-zinc-500 mt-0.5">{sub}</div>}
    </div>
  );
}

function App() {
  const [areaId, setArea] = useState("01100202");
  const [dayType, setDay] = useState("weekend");
  const [daypart, setPart] = useState("evening");
  const [bike, setBike] = useState("standard");
  const [open, setOpen] = useState(false);
  const r = getAnswer(areaId, dayType, daypart, bike);
  const t = TIER[r.tier];

  return (
    <div className="max-w-6xl mx-auto px-4 py-6">
      <header className="mb-6">
        <h1 className="text-3xl font-extrabold tracking-tight">Lock<span className="text-emerald-400">Out</span></h1>
        <p className="text-zinc-400 text-sm">Berlin Spatio-Temporal Theft Intel &amp; Locking Advisor</p>
        <p className="text-xs text-zinc-500 mt-1">Prototype – all figures are mock data.</p>
      </header>

      <div className="grid lg:grid-cols-[320px_1fr] gap-6">
        <aside className="space-y-4">
          <div>
            <label htmlFor="area" className="text-xs uppercase tracking-wider text-zinc-400 mb-1.5 block">Planning area</label>
            <select id="area" value={areaId} onChange={e => setArea(e.target.value)}
              className="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-sm">
              {Object.entries(AREAS).map(([id, a]) => <option key={id} value={id}>{id} - {a.name}</option>)}
            </select>
          </div>
          <Segmented label="Day type" options={DAYTYPES} value={dayType} onChange={setDay} />
          <Segmented label="Daypart" options={DAYPARTS} value={daypart} onChange={setPart} />
          <Segmented label="Bike category" options={BIKES} value={bike} onChange={setBike} />
          <BerlinMap areaId={areaId} tier={r.tier} />
        </aside>

        <main className="rounded-2xl bg-zinc-900 border border-zinc-800 p-5 space-y-5" aria-live="polite">
          <div className="flex flex-wrap items-center gap-3">
            <span className={"px-4 py-1.5 rounded-full border text-lg font-extrabold tracking-wide " + t.badge}>{r.tier} RISK</span>
            <span className="px-3 py-1 rounded-full bg-zinc-800 text-xs text-zinc-300">Confidence: {r.conf}</span>
            <span className="ml-auto text-sm text-zinc-400">Score {r.score}/100</span>
          </div>

          <section className="grid sm:grid-cols-2 gap-3">
            <div className="rounded-lg border border-zinc-800 p-3"><div className="text-xs text-zinc-400 mb-1">Hotspot volume</div><div className="font-semibold">{r.hotspot}</div></div>
            <div className="rounded-lg border border-zinc-800 p-3"><div className="text-xs text-zinc-400 mb-1">Activity context</div><div className="font-semibold">{r.context}</div></div>
          </section>

          <section>
            <div className="grid sm:grid-cols-3 gap-3">
              <Stat label="Defeated lock share" value={`${r.lockDefeat}%`} sub="of thefts involved broken locks" />
              <Stat label="Median stolen bike value" value={`€${r.value.toLocaleString("en-US")}`} sub="median value" />
              <div className="rounded-lg bg-zinc-950/60 border border-zinc-800 p-3 flex items-center">
                {r.spike
                  ? <span className="glow px-3 py-1.5 rounded-lg bg-amber-500/20 text-amber-300 text-sm font-semibold border border-amber-500/60">⚠️ 30-Day Incident Spike Detected</span>
                  : <span className="text-sm text-zinc-500">No 30-day incident spike</span>}
              </div>
            </div>
          </section>

          <section className={"rounded-lg border p-4 " + t.badge}>
            <h2 className="font-bold mb-2 text-zinc-100">Locking advice</h2>
            <ul className="list-disc pl-5 space-y-1.5 text-sm text-zinc-200">
              {r.advice.map((s, i) => <li key={i}>{s}</li>)}
            </ul>
            <div className="mt-3 flex flex-wrap gap-2 text-xs">
              <a href="https://www.berlin.de/polizei/polizeimeldungen/" target="_blank" rel="noreferrer" className="px-2 py-1 rounded bg-zinc-800 text-zinc-200 hover:bg-zinc-700">Source: Polizei Berlin – Prävention</a>
              <a href="https://www.adfc.de/artikel/fahrrad-diebstahl-vorbeugen" target="_blank" rel="noreferrer" className="px-2 py-1 rounded bg-zinc-800 text-zinc-200 hover:bg-zinc-700">Source: ADFC – Diebstahlschutz</a>
            </div>
          </section>

          <section className="rounded-lg border border-zinc-800">
            <button onClick={() => setOpen(!open)} aria-expanded={open} className="w-full flex justify-between items-center px-4 py-3 text-sm font-semibold">
              Why this score?<span className={"transition " + (open ? "rotate-180" : "")}>▾</span>
            </button>
            {open && <ul className="px-4 pb-4 list-disc pl-9 space-y-1 text-sm text-zinc-300">{r.factors.map((f, i) => <li key={i}>{f}</li>)}</ul>}
          </section>
        </main>
      </div>

      <footer className="mt-8 text-xs text-zinc-500 text-center">
        Datenquelle: Polizei Berlin (CC-BY 4.0) · © OpenStreetMap contributors (ODbL)
      </footer>
    </div>
  );
}

// Self-check: every combination yields a complete answer.
for (const a of [...Object.keys(AREAS), "bogus"]) for (const d of [...Object.keys(DAYTYPES), "x"]) for (const p of [...Object.keys(DAYPARTS), "x"]) for (const b of [...Object.keys(BIKES), "x"]) {
  const r = getAnswer(a, d, p, b);
  console.assert(TIER[r.tier] && r.advice.length && r.factors.length && Number.isFinite(r.value), "bad answer", a, d, p, b);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
