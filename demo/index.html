<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LockOut – Berlin Theft Intel (Prototype)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
  html,body,#root{height:100%;margin:0}
  @keyframes glow { 0%,100%{box-shadow:0 0 6px #f59e0b} 50%{box-shadow:0 0 18px #f59e0b} }
  .glow { animation:glow 1.6s ease-in-out infinite; }
  .sheet { transition: transform .3s ease; }
  .leaflet-container { background:#18181b; }
  @keyframes selPulse { 0%,100%{stroke-opacity:1} 50%{stroke-opacity:.25} }
  .sel-poly { animation: selPulse 1.4s ease-in-out infinite; }
</style>
</head>
<body class="bg-zinc-950 text-zinc-100">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

// ---------- MOCK FIXTURE (random, NOT real LOR geometry or statistics) ----------
// shortcut: jittered grid stands in for the LOR planning-area GeoJSON; swap in the real file when it is loaded.
const COLS = 8, ROWS = 6, LAT0 = 52.38, LAT1 = 52.64, LNG0 = 13.14, LNG1 = 13.64;
let seed = 17;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647; // deterministic PRNG
const FACTOR_POOL = ["High transit foot traffic", "Low street rack density", "Peak evening entertainment corridor",
  "Dense residential blocks with many street-parked bikes", "Long dwell-time commuter parking", "Good shop/café natural surveillance"];

const verts = Array.from({ length: ROWS + 1 }, (_, r) => Array.from({ length: COLS + 1 }, (_, c) => {
  const edge = r === 0 || c === 0 || r === ROWS || c === COLS;
  const j = edge ? 0 : 0.35;
  return [LAT1 - (r + (rnd() - .5) * j) * (LAT1 - LAT0) / ROWS, LNG0 + (c + (rnd() - .5) * j) * (LNG1 - LNG0) / COLS];
}));
const AREAS = {};
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
  const id = `0${r + 1}${String(c + 1).padStart(2, "0")}0101`;
  const base = 35 + rnd() * 60;
  AREAS[id] = {
    id, name: `Planning area ${id}`, base, rank: Math.max(1, Math.round(100 - base)),
    ctx: Math.round((base - 65) * 1.5), lockDefeat: Math.round(65 + rnd() * 25), value: Math.round((600 + rnd() * 800) / 10) * 10,
    spike: rnd() > 0.7, factors: [0, 1, 2].map(i => FACTOR_POOL[(Math.floor(rnd() * 6) + i * 2) % 6]),
    poly: [verts[r][c], verts[r][c + 1], verts[r + 1][c + 1], verts[r + 1][c]],
  };
}
const FALLBACK_AREA = AREAS["01010101"];
const DAYTYPES = { weekday: { label: "Mon–Thu", d: 0 }, friday: { label: "Friday", d: 6 }, weekend: { label: "Weekend", d: 4 } };
const DAYPARTS = { morning: { label: "Morning (06–11)", d: -8 }, afternoon: { label: "Afternoon (11–17)", d: 0 }, evening: { label: "Evening (17–22)", d: 9 }, night: { label: "Night (22–06)", d: 14 } };
const BIKES = { standard: { label: "Standard Bike", d: 0, valueX: 1 }, ebike: { label: "E-Bike / Cargo", d: 7, valueX: 2.6 } };
const mod = (table, key) => table[key] || { d: 0, valueX: 1 };

// Deterministic: unknown keys fall back to defaults, never throw.
function getAnswer(areaId, dayType, daypart, bike) {
  const a = AREAS[areaId] || FALLBACK_AREA;
  const b = mod(BIKES, bike);
  const score = Math.max(0, Math.min(100, a.base + mod(DAYTYPES, dayType).d + mod(DAYPARTS, daypart).d + b.d));
  const tier = score >= 75 ? "HIGH" : score >= 55 ? "MEDIUM" : "LOW";
  const night = daypart === "night" || daypart === "evening";
  return {
    score: Math.round(score), tier, area: a, bike,
    conf: a.rank <= 10 ? "HIGH" : a.rank <= 25 ? "MEDIUM" : "LOW",
    hotspot: `Top ${a.rank}% theft volume in Berlin`,
    context: a.ctx >= 0 ? `${a.ctx}% higher theft risk than typical for an area with this transit/shop density`
                        : `${-a.ctx}% lower theft risk than typical for an area with this transit/shop density`,
    lockDefeat: Math.min(98, a.lockDefeat + (b.valueX > 1 ? 3 : 0)),
    value: Math.round(a.value * b.valueX / 10) * 10,
    spike: a.spike && score >= 55,
    advice: adviceFor(tier, bike, night),
    factors: night ? [...a.factors.slice(0, 2), "Reduced natural surveillance after dark"] : a.factors,
  };
}
function adviceFor(tier, bike, night) {
  const out = [];
  if (tier === "HIGH") out.push("Dual-lock strategy: a VdS Klasse A+ / B+ rated hardened square-shackle U-lock plus a second lock of a different type (e.g. plate-chain).");
  else if (tier === "MEDIUM") out.push("Use one VdS Klasse B+ rated hardened square-shackle U-lock; add a second lock if parking longer than a few hours.");
  else out.push("A quality hardened U-lock (VdS-rated) is sufficient for short stops; avoid thin cable locks.");
  out.push("Lock frame and rear wheel to a fixed, immovable rack or post, shackle tight against the frame.");
  if (night) out.push("Prefer a well-lit, busy spot; avoid leaving the bike overnight on the street here.");
  if (bike === "ebike") out.push("E-Bike / Cargo: remove battery and display when parking; register the frame number with an anti-theft code.");
  return out;
}

// ---------- UI ----------
const TIER = {
  LOW:    { hex: "#10b981", label: "LOW RISK",  badge: "bg-emerald-500/15 text-emerald-300 border-emerald-500/50" },
  MEDIUM: { hex: "#f59e0b", label: "MID RISK",  badge: "bg-amber-500/15 text-amber-300 border-amber-500/50" },
  HIGH:   { hex: "#f43f5e", label: "HIGH RISK", badge: "bg-rose-500/15 text-rose-300 border-rose-500/50" },
};

function Select({ label, options, value, onChange }) {
  return (
    <select aria-label={label} value={value} onChange={e => onChange(e.target.value)}
      className="flex-1 min-w-0 bg-zinc-800 border border-zinc-700 rounded-full px-3 py-1.5 text-xs sm:text-sm">
      {Object.entries(options).map(([k, o]) => <option key={k} value={k}>{o.label}</option>)}
    </select>
  );
}

function RiskMap({ filters, selected, onSelect }) {
  const mapEl = useRef(null), map = useRef(null), layers = useRef({});
  useEffect(() => {
    const m = L.map(mapEl.current, { zoomControl: false, attributionControl: true }).fitBounds([[LAT0, LNG0], [LAT1, LNG1]]);
    L.control.zoom({ position: "bottomright" }).addTo(m);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18, attribution: "© OpenStreetMap contributors" }).addTo(m);
    Object.values(AREAS).forEach(a => {
      layers.current[a.id] = L.polygon(a.poly, { weight: 1, color: "#18181b", fillOpacity: 0.55 })
        .on("click", () => onSelect(a.id)).addTo(m);
    });
    map.current = m;
    setTimeout(() => { m.invalidateSize(); m.fitBounds([[LAT0, LNG0], [LAT1, LNG1]]); }, 100); // container size settles after first paint
    return () => m.remove();
  }, []);
  useEffect(() => { // recolor on filter / selection change
    Object.values(AREAS).forEach(a => {
      const p = layers.current[a.id], sel = a.id === selected;
      const hex = TIER[getAnswer(a.id, filters.day, filters.part, filters.bike).tier].hex;
      p.setStyle({ fillColor: hex, color: sel ? "#fff" : "#18181b", weight: sel ? 3 : 1, fillOpacity: sel ? 0.8 : 0.55 });
      p.getElement()?.classList.toggle("sel-poly", sel);
      if (sel) p.bringToFront();
    });
  }, [filters, selected]);
  return <div className="absolute inset-0"><div ref={mapEl} style={{ height: "100%" }} /></div>;
}

function Stat({ label, value }) {
  return (
    <div className="rounded-lg bg-zinc-950/60 border border-zinc-800 p-3">
      <div className="text-lg font-bold">{value}</div>
      <div className="text-xs text-zinc-400">{label}</div>
    </div>
  );
}

function Sheet({ r, onClose }) {
  const [open, setOpen] = useState(false);
  const t = TIER[r.tier];
  return (
    <div className="sheet absolute z-[1000] bottom-0 left-0 right-0 max-h-[70%] overflow-y-auto bg-zinc-900 border-t border-zinc-700 rounded-t-2xl p-4 space-y-4 sm:left-auto sm:right-4 sm:bottom-4 sm:w-[420px] sm:rounded-2xl sm:border sm:max-h-[calc(100%-6rem)]" aria-live="polite">
      <div className="flex items-start justify-between gap-3">
        <div>
          <div className="text-xs text-zinc-400">{r.area.name}</div>
          <div className="flex flex-wrap items-center gap-2 mt-1">
            <span className={"px-4 py-1 rounded-full border text-lg font-extrabold " + t.badge}>{t.label}</span>
            <span className="px-3 py-1 rounded-full bg-zinc-800 text-xs text-zinc-300">Confidence: {r.conf}</span>
          </div>
        </div>
        <button onClick={onClose} aria-label="Close" className="text-zinc-400 hover:text-white text-xl leading-none">×</button>
      </div>

      <div className="grid grid-cols-2 gap-2 text-sm">
        <div className="rounded-lg border border-zinc-800 p-2.5"><div className="text-xs text-zinc-400">Hotspot volume</div>{r.hotspot}</div>
        <div className="rounded-lg border border-zinc-800 p-2.5"><div className="text-xs text-zinc-400">Activity context</div>{r.context}</div>
      </div>

      <div className="grid grid-cols-2 gap-2">
        <Stat label="of thefts involved broken locks" value={`${r.lockDefeat}%`} />
        <Stat label="median stolen bike value" value={`€${r.value.toLocaleString("en-US")}`} />
      </div>
      {r.spike && <div className="glow inline-block px-3 py-1.5 rounded-lg bg-amber-500/20 text-amber-300 text-sm font-semibold border border-amber-500/60">⚠️ 30-Day Incident Spike Detected</div>}

      <section className={"rounded-lg border p-3 " + t.badge}>
        <h2 className="font-bold mb-1.5 text-zinc-100">Locking advice</h2>
        <ul className="list-disc pl-5 space-y-1 text-sm text-zinc-200">{r.advice.map((s, i) => <li key={i}>{s}</li>)}</ul>
        <div className="mt-2 flex flex-wrap gap-2 text-xs">
          <a href="https://www.berlin.de/polizei/" target="_blank" rel="noreferrer" className="px-2 py-1 rounded bg-zinc-800 text-zinc-200">Source: Polizei Berlin</a>
          <a href="https://www.adfc.de/" target="_blank" rel="noreferrer" className="px-2 py-1 rounded bg-zinc-800 text-zinc-200">Source: ADFC</a>
        </div>
      </section>

      <section className="rounded-lg border border-zinc-800">
        <button onClick={() => setOpen(!open)} aria-expanded={open} className="w-full flex justify-between px-3 py-2.5 text-sm font-semibold">
          Why this score? ({r.score}/100)<span>{open ? "▴" : "▾"}</span>
        </button>
        {open && <ul className="px-3 pb-3 list-disc pl-8 space-y-1 text-sm text-zinc-300">{r.factors.map((f, i) => <li key={i}>{f}</li>)}</ul>}
      </section>
    </div>
  );
}

function App() {
  const [filters, setFilters] = useState({ day: "weekend", part: "evening", bike: "standard" });
  const [selected, setSelected] = useState(null);
  const [info, setInfo] = useState(false);
  const set = k => v => setFilters(f => ({ ...f, [k]: v }));
  const r = selected && getAnswer(selected, filters.day, filters.part, filters.bike);

  return (
    <div className="relative h-full flex flex-col overflow-hidden">
      <header className="z-[1100] bg-zinc-900 border-b border-zinc-800 px-3 py-2">
        <div className="flex items-center gap-2">
          <h1 className="font-extrabold text-lg mr-1">Lock<span className="text-emerald-400">Out</span></h1>
          <Select label="Day type" options={DAYTYPES} value={filters.day} onChange={set("day")} />
          <Select label="Daypart" options={DAYPARTS} value={filters.part} onChange={set("part")} />
          <Select label="Bike category" options={BIKES} value={filters.bike} onChange={set("bike")} />
          <button onClick={() => setInfo(true)} aria-label="Information and disclaimer"
            className="shrink-0 w-8 h-8 rounded-full border border-zinc-600 text-sm font-serif italic">i</button>
        </div>
        <p className="text-[11px] text-zinc-500 mt-1">Berlin Spatio-Temporal Theft Intel &amp; Locking Advisor · prototype, random mock data</p>
      </header>

      <div className="relative flex-1">
        <RiskMap filters={filters} selected={selected} onSelect={setSelected} />
        {location.protocol === "file:" && <div className="absolute z-[1500] top-14 left-3 right-3 p-3 rounded-lg bg-rose-900 border border-rose-500 text-sm">OSM blocks tiles for pages opened from disk (no Referer). Run <code className="bg-black/40 px-1 rounded">python3 -m http.server 8000 -d demo</code> and open http://localhost:8000</div>}
        {!selected && <div className="absolute z-[1000] top-3 left-1/2 -translate-x-1/2 px-3 py-1.5 rounded-full bg-zinc-900/90 text-xs border border-zinc-700 pointer-events-none">Tap an area to see risk &amp; locking advice</div>}
        {r && <Sheet r={r} onClose={() => setSelected(null)} />}
      </div>

      <footer className="z-[1100] bg-zinc-900 border-t border-zinc-800 text-[11px] text-zinc-500 text-center py-1">
        Datenquelle: Polizei Berlin (CC-BY 4.0) · © OpenStreetMap contributors (ODbL)
      </footer>

      {info && (
        <div className="absolute inset-0 z-[2000] bg-black/70 flex items-center justify-center p-4" onClick={() => setInfo(false)}>
          <div className="bg-zinc-900 border border-zinc-700 rounded-2xl p-5 max-w-md text-sm space-y-2" onClick={e => e.stopPropagation()}>
            <h2 className="font-bold text-lg">About LockOut</h2>
            <p>Risk tiers are statistical estimates from reported bicycle thefts per planning area, day type and daypart. They are guidance, not a guarantee that a bike is safe or unsafe.</p>
            <p className="text-amber-300">This prototype uses random polygons and invented numbers.</p>
            <button onClick={() => setInfo(false)} className="mt-2 px-4 py-1.5 rounded-full bg-zinc-100 text-zinc-900 font-semibold">Close</button>
          </div>
        </div>
      )}
    </div>
  );
}

// Self-check: every combination (incl. bogus keys) yields a complete answer.
for (const a of [...Object.keys(AREAS), "bogus"]) for (const d of [...Object.keys(DAYTYPES), "x"]) for (const p of [...Object.keys(DAYPARTS), "x"]) for (const b of [...Object.keys(BIKES), "x"]) {
  const r = getAnswer(a, d, p, b);
  console.assert(TIER[r.tier] && r.advice.length && r.factors.length && Number.isFinite(r.value), "bad answer", a, d, p, b);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
