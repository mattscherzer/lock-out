name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths: [demo/**, frontend/public/gazetteer.json, frontend/public/gazetteer_streets.json]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # the demo and the frontend share the lookup files; the demo fetches them next to its index.html
      - run: cp frontend/public/gazetteer.json frontend/public/gazetteer_streets.json demo/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - id: deployment
        uses: actions/deploy-pages@v4
