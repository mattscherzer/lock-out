name: Weekly Police Data Refresh & Precompute

on:
  # Run automatically every Monday at 06:00 UTC
  schedule:
    - cron: "0 6 * * 1"
  # Allow manual trigger from the GitHub Actions tab anytime
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: open a PR even if the data did not change. Close that PR without merging."
        type: boolean
        default: false

# main is protected, so the job opens a PR instead of pushing; pull-requests: write lets the default token do that (D-19)
permissions:
  contents: write
  pull-requests: write

jobs:
  update-risk-lookup:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up uv (Python version comes from .python-version)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 3. Install Dependencies
        run: uv sync --frozen

      - name: 4. Restore Last Known Good Police CSV (Fallback Cache)
        uses: actions/cache@v4
        with:
          # [Ff] covers the tracked "Fahrraddiebstahl.csv" and the lowercase name
          path: |
            data/raw/[Ff]ahrraddiebstahl.csv
            data/raw/.fetched_at
          # Cache keys are immutable: a unique key per run saves the newest file,
          # and restore-keys picks the most recent earlier one.
          key: police-csv-${{ github.run_id }}
          restore-keys: |
            police-csv-

      - name: 5. Fetch Latest Police CSV (or Fallback to Cache)
        run: uv run python -m lockout.cli.fetch

      - name: 6. Run Audit / Precompute Pipeline
        run: |
          uv run python -m lockout.cli.audit
          # When the build step is switched on, uncomment below to regenerate lookup_schema_v1.json:
          # uv run python -m lockout.cli.build_lookup

      # Repeats the schema check from tests.yaml on purpose: PRs opened with the default token do not trigger other
      # workflows, so the checks run here and block the PR on failure (D-19)
      - name: 7. Check the Lookup JSON Against the Schema
        run: uv run python -m lockout.cli.check_lookup

      - name: 8. Open a PR With the Updated Lookup JSON
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          BRANCH: refresh/${{ github.run_id }}-${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # the PR branch points at main but keeps the files this run wrote, so a run from a feature branch
          # still compares only the lookup with main
          git fetch --depth=1 origin main
          git switch -c "$BRANCH"
          git reset -q FETCH_HEAD
          git add data/processed/lookup_schema_v1.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): automated weekly risk lookup refresh"
            title="Automated weekly risk lookup refresh"
            if [ "$DRY_RUN" = "true" ]; then
              title="Dry-run refresh with a data change, close without merging"
            fi
          elif [ "$DRY_RUN" = "true" ]; then
            git commit --allow-empty -m "Dry-run refresh: no data change"
            title="Dry-run refresh: no data change, close without merging"
          else
            echo "No data change, so no PR."
            exit 0
          fi
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "$title" --body "Opened by the refresh workflow: $RUN_URL"
