name: Weekly Police Data Refresh & Precompute

on:
  # Run automatically every Monday at 06:00 UTC
  schedule:
    - cron: "0 6 * * 1"
  # Allow manual trigger from the GitHub Actions tab anytime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-risk-lookup:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. Install Dependencies
        run: pip install -r requirements.txt

      - name: 4. Restore Last Known Good Police CSV (Fallback Cache)
        uses: actions/cache@v4
        with:
          path: data/raw/fahrraddiebstahl.csv
          key: police-csv-latest
          restore-keys: |
            police-csv-

      - name: 5. Fetch Latest Police CSV (or Fallback to Cache)
        run: python src/fetch_police_csv.py

      - name: 6. Run Audit / Precompute Pipeline
        run: |
          python src/audit_police_csv.py
          # In Week 2, uncomment below to regenerate lookup_schema_v1.json:
          # python src/build_lookup_json.py

      - name: 7. Commit & Push Updated Lookup JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/lookup_schema_v1.json
          git diff --staged --quiet || (git commit -m "chore(data): automated weekly risk lookup refresh" && git push)