name: Weekly Police Data Refresh & Precompute

on:
  # Run automatically every Monday at 06:00 UTC
  schedule:
    - cron: "0 6 * * 1"
  # Allow manual trigger from the GitHub Actions tab anytime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-risk-lookup:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up uv (Python version comes from .python-version)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 3. Install Dependencies
        run: uv sync --frozen

      - name: 4. Restore Last Known Good Police CSV (Fallback Cache)
        uses: actions/cache@v4
        with:
          # [Ff] covers the tracked "Fahrraddiebstahl.csv" and the lowercase name
          path: |
            data/raw/[Ff]ahrraddiebstahl.csv
            data/raw/.fetched_at
          # Cache keys are immutable: a unique key per run saves the newest file,
          # and restore-keys picks the most recent earlier one.
          key: police-csv-${{ github.run_id }}
          restore-keys: |
            police-csv-

      - name: 5. Fetch Latest Police CSV (or Fallback to Cache)
        run: uv run python src/fetch_police_csv.py

      - name: 6. Run Audit / Precompute Pipeline
        run: |
          uv run python src/audit_police_csv.py
          # In Week 2, uncomment below to regenerate lookup_schema_v1.json:
          # uv run python src/build_lookup_json.py

      - name: 7. Commit & Push Updated Lookup JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/lookup_schema_v1.json
          git diff --staged --quiet || (git commit -m "chore(data): automated weekly risk lookup refresh" && git push)