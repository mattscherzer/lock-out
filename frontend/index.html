<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lock Out – Berlin areas</title>
  </head>
  <body class="h-full">
    <!-- own stacking context: Leaflet's controls stay below the search (z-search) -->
    <div id="map" class="z-0 h-full"></div>
    <div
      id="status"
      class="absolute bottom-6 left-2 z-map-controls rounded-xs px-2 py-1 empty:hidden"
      aria-live="polite"
    ></div>
    <div id="legend" class="absolute z-map-controls"></div>
    <div id="search"></div>
    <div id="answer"></div>
    <div id="about"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
