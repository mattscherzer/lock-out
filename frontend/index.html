<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lock Out – Berlin areas</title>
  </head>
  <body class="h-full">
    <!-- own stacking context: Leaflet's controls stay below the search (z-search) -->
    <div id="map" class="z-0 h-full"></div>
    <div
      id="status"
      class="absolute bottom-6 left-2 z-map-controls rounded-xs px-2 py-1 empty:hidden"
      aria-live="polite"
    ></div>
    <div
      id="legend"
      class="absolute bottom-(--map-controls-bottom) left-2 z-map-controls hidden transition-transform duration-base ease-standard min-[600px]:left-1/2 min-[600px]:block min-[600px]:-translate-x-1/2 min-[600px]:[body:has(.answer-card[data-open]:not([data-collapsed]))_&]:translate-x-[calc(50vw-100%-10px-var(--control-sm)-var(--space-2))]"
    ></div>
    <div
      id="legend-menu"
      class="absolute top-[calc(var(--space-16)+var(--space-4))] right-4 z-map-controls min-[600px]:hidden"
    ></div>
    <div id="search"></div>
    <div id="answer"></div>
    <div id="about"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
