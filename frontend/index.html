<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- before first paint; the key must match PALETTE_KEY in src/map/palette.ts -->
    <script>
      try {
        if (localStorage.getItem("palette") === "cb")
          document.documentElement.dataset.palette = "cb";
      } catch {}
    </script>
    <title>Lock Out – Berlin areas</title>
  </head>
  <body class="h-full">
    <!-- own stacking context: Leaflet's controls stay below the search (z-search) -->
    <div id="map" class="z-0 h-full"></div>
    <div
      id="status"
      class="absolute bottom-6 left-2 z-map-controls rounded-xs px-2 py-1 empty:hidden"
      aria-live="polite"
    ></div>
    <div
      id="legend"
      class="absolute bottom-(--map-controls-bottom) left-2 z-map-controls transition-transform duration-base ease-standard min-[600px]:left-1/2 min-[600px]:w-max min-[600px]:-translate-x-1/2 max-[599px]:[body:has(.answer-card[data-open])_&]:invisible min-[600px]:[body:has(.answer-card[data-open]:not([data-collapsed]))_&]:translate-x-[calc(50vw-100%-var(--map-controls-inset)-var(--control-sm)-var(--space-2))] max-[599px]:[body[data-legend-tight]_&]:invisible"
    ></div>
    <div
      id="legend-menu"
      class="absolute top-[calc(var(--space-16)+var(--space-4))] right-4 z-map-controls hidden max-[599px]:[body:has(.answer-card[data-open])_&]:block max-[599px]:[body[data-legend-tight]_&]:block"
    ></div>
    <div id="search"></div>
    <div id="answer"></div>
    <div id="about"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
