<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- before first paint; the key must match PALETTE_KEY in src/map/paletteStorage.ts -->
    <script>
      try {
        if (localStorage.getItem("lockout:palette") === "cb")
          document.documentElement.dataset.palette = "cb";
      } catch {}
    </script>
    <title>Lock Out – Berlin areas</title>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
