<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lock Out – Berlin areas</title>
    <style>
      html, body, #map { height: 100%; margin: 0; }
      #map { z-index: 0; } /* own stacking context: Leaflet's controls stay below the search (z-search) */
      /* the browser draws a focus outline on a clicked area; areas are selected by pointer, the search is the keyboard route */
      path.leaflet-interactive:focus { outline: none; }
      #status:empty { display: none; }
      #status { position: absolute; z-index: 800; bottom: 24px; left: 8px; padding: 4px 8px;
        background: #fff; border-radius: 4px; font: 14px system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="status" aria-live="polite"></div>
    <div id="search"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
